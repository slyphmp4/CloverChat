plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.slyph'
def resolvedPluginVersion = providers.gradleProperty('pluginVersion').getOrElse('1.6.0')
version = resolvedPluginVersion

def versionFile = file('gradle.properties')

def parseVersion = { String input ->
    def matcher = (input =~ /(\d+)\.(\d+)\.(\d+)/)
    if (!matcher.matches()) {
        throw new GradleException("Invalid pluginVersion format: ${input}")
    }
    return [
            matcher[0][1].toInteger(),
            matcher[0][2].toInteger(),
            matcher[0][3].toInteger()
    ]
}

def writeVersion = { int major, int minor, int patch ->
    String updated = "${major}.${minor}.${patch}"
    versionFile.text = "pluginVersion=${updated}\n"
    println "pluginVersion=${updated}"
}

tasks.register('bumpPatchVersion') {
    doLast {
        String current = providers.gradleProperty('pluginVersion').getOrElse('1.6.0')
        def parts = parseVersion(current)
        writeVersion(parts[0], parts[1], parts[2] + 1)
    }
}

tasks.register('bumpMinorVersion') {
    doLast {
        String current = providers.gradleProperty('pluginVersion').getOrElse('1.6.0')
        def parts = parseVersion(current)
        writeVersion(parts[0], parts[1] + 1, 0)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

configurations {
    minecraft26_2CompileClasspath {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom implementation
        attributes {
            attribute(
                    org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_API)
            )
            attribute(
                    org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.LIBRARY)
            )
            attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
        }
    }
}

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    minecraft26_2CompileClasspath 'io.papermc.paper:paper-api:26.2.build.112-stable'
    minecraft26_2CompileClasspath 'me.clip:placeholderapi:2.11.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.compileJava {
    options.release = 11
}

tasks.register('compileMinecraft26_2Java', JavaCompile) {
    source sourceSets.main.java
    classpath = configurations.minecraft26_2CompileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/java/minecraft26_2')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    options.release = 25
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: resolvedPluginVersion)
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    archiveBaseName.set('CloverChat')
    archiveVersion.set('')
    archiveClassifier.set('')
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.check {
    dependsOn tasks.compileMinecraft26_2Java
}
