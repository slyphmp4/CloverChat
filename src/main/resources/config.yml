# ============================================================
# CloverChat - main config
# Author: slyphmp4
# ============================================================
#
# Этот конфиг сделан с большим количеством свободного места,
# чтобы вам было удобно оставлять свои заметки и пояснения.
#
# Ниже почти в каждом разделе есть блок:
# "Ваши заметки"
#
# Можете спокойно писать там что угодно.
#
# ============================================================


# ============================================================
# GENERAL
# ============================================================

# HEX colors support in texts like: &FF0000
hex-colors: true

# Active language folder from: langs/<language>
# Available now: ru, ua, en, de
language: "ru"


# ============================================================
# CHAT CACHE
# ============================================================
# Три независимые области: форматы, hover и значения PlaceholderAPI.
# TTL задается в миллисекундах: 1000 = 1 секунда, 60000 = 1 минута.
# enabled: false или ttl-millis: 0 отключает соответствующий кэш.
# При /cloverchatreload confirm все кэши пересоздаются.
# Результаты PAPI разделены по UUID игрока; неизвестные плейсхолдеры
# не кэшируются. Текст сообщения, его время и ID не подменяются кэшем.
# max-entries ограничивает каждый внутренний буфер этой области.

chat-cache:
  enabled: true

  formats:
    enabled: true
    ttl-millis: 60000
    max-entries: 4096

  hovers:
    enabled: true
    ttl-millis: 60000
    max-entries: 4096

  placeholderapi:
    enabled: true
    ttl-millis: 1000
    max-entries: 10000

    # Правило применяется только к указанному плейсхолдеру.
    # replacements заменяет только ТОЧНОЕ значение, с учетом регистра.
    # Например, from: "0" не заменит "10" или "&a0".
    # Цвета в to поддерживаются как обычно: &7, &FF0000, &#FF0000.
    # rules: [] оставляет все плейсхолдеры без отдельных правил.
    rules:
      - placeholder: "%cloverrep_reputation%"
        ttl-millis: 1000
        replacements: []

      # Пример для часто меняющихся данных: не кэшировать значение.
      - placeholder: "%player_health%"
        ttl-millis: 0
        replacements: []

      # Пример точной замены; раскомментируйте для применения.
      # - placeholder: "%example_status%"
      #   ttl-millis: 3000
      #   replacements:
      #     - from: "online"
      #       to: "&aВ сети"
      #     - from: "offline"
      #       to: "&7Не в сети"

# ----------------------------
# Ваши заметки (GENERAL)
#
#
#
# ----------------------------


# ============================================================
# UPDATE CHECKER
# ============================================================

update-checker:
  # true - проверка обновлений включена
  # false - проверка обновлений выключена
  enabled: true

# ----------------------------
# Ваши заметки (UPDATE CHECKER)
#
#
#
# ----------------------------


# ============================================================
# VELOCITY PROXY SYNC
# ============================================================
# Cross-server chat sync through Velocity proxy.
#
# Требование в velocity.toml:
# bungee-plugin-message-channel = true
#
# Быстрый старт:
# 1) Установите CloverChat на каждый backend-сервер.
# 2) Включите proxy-sync.enabled: true на всех серверах.
# 3) Укажите уникальный proxy-sync.server-id для каждого сервера.
# 4) Оставьте одинаковый proxy-sync.subchannel на всех серверах.
# 5) Оставьте target-server: "ALL", чтобы глобальный чат видели на всех серверах.
#
# Через Velocity синхронизируется только глобальный чат.
# Локальный чат, групповые каналы и личные сообщения остаются внутри backend-сервера.

proxy-sync:
  enabled: false

  # VELOCITY - прежняя передача через прокси, без Redis.
  # REDIS - передача через Redis Pub/Sub, независимо от прокси.
  # Работает только один транспорт, чтобы не дублировать сообщения.
  # В обоих режимах передается ТОЛЬКО глобальный чат.
  transport: "VELOCITY"

  # Уникальное имя этого backend-сервера
  server-id: "survival"

  # Одинаковый секрет минимум из 32 символов на всех backend-серверах
  # Рекомендуется не хранить секрет здесь, а задать переменную окружения:
  # CLOVERCHAT_PROXY_SECRET
  # Синхронизация не запустится с пустым или коротким секретом
  shared-secret: ""

  # Куда отправлять: ALL или конкретное имя backend-сервера
  target-server: "ALL"

  # Одинаковый subchannel на всех backend-серверах
  subchannel: "CloverChatSync"

  # Время хранения ID сообщений для защиты от дублей
  dedup-cache-seconds: 120

  # Максимальный возраст входящего сообщения
  max-message-age-seconds: 45

  # Максимальное количество ID в памяти для защиты от переполнения
  max-dedup-entries: 10000

  # Подробные логи синхронизации
  debug-log: false

  server-tag:
    # Добавлять префикс сервера у входящих сообщений
    enabled: true

    # %server% = server-id источника
    format: "&#65798F[&#AFCFFF%server%&#65798F] "

  # Для Redis: enabled: true, transport: REDIS, уникальный server-id
  # и одинаковый shared-secret / CLOVERCHAT_PROXY_SECRET на серверах.
  # Redis Pub/Sub не хранит сообщения и не доставляет пропущенную историю.
  # При недоступности Redis обычный чат на сервере продолжает работать.
  redis:
    # STANDALONE - один Redis; SENTINEL - поиск текущего master;
    # CLUSTER - несколько узлов с автоматическим обновлением топологии.
    mode: "STANDALONE"
    channel: "cloverchat:global"
    timeout-millis: 5000
    retry-seconds: 10
    request-queue-limit: 512

    # ACL-пользователь Redis. Пустой username = старый AUTH по паролю.
    # Лучше использовать CLOVERCHAT_REDIS_USERNAME и
    # CLOVERCHAT_REDIS_PASSWORD вместо хранения пароля в файле.
    username: ""
    password: ""

    ssl:
      # Для удаленного Redis используйте TLS и порт TLS вашего сервера.
      enabled: false
      # Проверяет сертификат и имя узла. Не отключайте на публичной сети.
      verify-peer: true
      # Специальный режим Lettuce для совместимого StartTLS endpoint.
      # Для стандартного TLS-порта Redis оставляйте false.
      # Начальная команда может быть незашифрованной: этот режим
      # запрещен с ACL/паролем. Для них используйте обычный TLS.
      start-tls: false

    standalone:
      host: "127.0.0.1"
      port: 6379

    sentinel:
      master-name: "mymaster"
      # Sentinel может иметь отдельную ACL-учетную запись.
      # CLOVERCHAT_REDIS_SENTINEL_USERNAME / _PASSWORD также поддержаны.
      username: ""
      password: ""
      ssl:
        enabled: false
        verify-peer: true
        start-tls: false
      nodes:
        - host: "127.0.0.1"
          port: 26379
        - host: "127.0.0.1"
          port: 26380

    cluster:
      # Стартовые адреса; все найденные узлы должны быть доступны
      # backend-серверам Minecraft, включая адреса из топологии Redis.
      nodes:
        - host: "127.0.0.1"
          port: 7000
        - host: "127.0.0.1"
          port: 7001
        - host: "127.0.0.1"
          port: 7002

# ----------------------------
# Ваши заметки (VELOCITY)
#
#
#
# ----------------------------


# ============================================================
# CHAT PLACEHOLDERS
# ============================================================

# Плейсхолдеры имени, которые CloverChat может подхватывать
# Первый рабочий плейсхолдер в формате будет использоваться
chat-name-placeholders:
  - "%player_name%"
  - "%cloverrep_nick%"

# Плейсхолдеры репутации
chat-reputation-placeholders:
  - "%cloverrep_reputation%"

# ----------------------------
# Ваши заметки (PLACEHOLDERS)
#
#
#
# ----------------------------


# ============================================================
# REPUTATION HOVER
# ============================================================

reputation-hover:
  enabled: true

  # Команда только подставляется в чат (не выполняется)
  suggest-command: "/rep "

# ----------------------------
# Ваши заметки (REPUTATION HOVER)
#
#
#
# ----------------------------


# ============================================================
# LOCAL / GLOBAL CHAT
# ============================================================

local-chat:
  enabled: true

  # Радиус локального чата в блоках
  radius: 70

global-chat:
  enabled: true

  # Префикс глобального сообщения, например: !привет
  prefix: "!"

# ----------------------------
# Ваши заметки (LOCAL/GLOBAL)
#
#
#
# ----------------------------


# ============================================================
# MESSAGE STYLES BY PERMISSION OR ULTRAPERMISSIONS GROUP
# ============================================================
# Здесь настраивается внешний вид только текста сообщения игрока.
# Ник, префикс, репутация и значки не изменяются.
# Hover сообщения и интерактивные действия ссылок сохраняются.
#
# Как работает выбор:
# 1) Плагин берет все включенные правила.
# 2) Сначала проверяет правило с самым большим priority.
# 3) Применяет только первое подходящее правило.
#
# selector.type:
# PERMISSION             - проверка права игрока.
# ULTRAPERMISSIONS_GROUP - точное имя основной группы UltraPermissions.
# Для PERMISSION можно указать любое право из вашей системы прав.
#
# Для ULTRAPERMISSIONS_GROUP нужны PlaceholderAPI и плейсхолдер
# %uperms_group%. В value указывается ID группы, например: admin,
# moderator, vip или default. Это не цветной префикс группы.
#
# Поддерживаемые цвета:
# &#FF5555, &FF5555, #FF5555, &c или название red/gold/aqua.
# color: "" или color: "none" оставляет цвет без переопределения.
#
# gradient.enabled: true включает градиент вместо обычного color.
# В gradient.colors нужно указать минимум 2 цвета.
# Можно указать 3 и больше цветов для сложного плавного перехода.
# Если градиент выключен или настроен неправильно, используется color.
#
# bold         - жирный текст
# italic       - курсив
# underlined   - подчеркнутый текст
# strikethrough - зачеркнутый текст
#
# После изменения используйте: /cloverchatreload confirm

message-styles:
  enabled: true

  fallback:
    # Включите, если нужен один стиль для всех, кому не подошло ни одно правило
    enabled: false
    color: "&f"
    gradient:
      enabled: false
      colors:
        - "&#CBFFF7"
        - "&#90FFE7"
    bold: false
    italic: false
    underlined: false
    strikethrough: false

  rules:
    admin-permission:
      enabled: true
      priority: 200
      selector:
        type: "PERMISSION"
        value: "cloverchat.message-style.admin"
      style:
        color: "&#FF6B6B"
        gradient:
          enabled: false
          colors:
            - "&#FF5555"
            - "&#FFB86C"
        bold: true
        italic: false
        underlined: false
        strikethrough: false

    vip-permission:
      enabled: true
      priority: 100
      selector:
        type: "PERMISSION"
        value: "cloverchat.message-style.vip"
      style:
        color: "&#FFD667"
        gradient:
          enabled: false
          colors:
            - "&#FFD667"
            - "&#FFF3D6"
        bold: false
        italic: false
        underlined: false
        strikethrough: false

    ultrapermissions-admin-group:
      # Выключено как пример. Поменяйте на true для группы admin
      enabled: false
      priority: 300
      selector:
        type: "ULTRAPERMISSIONS_GROUP"
        value: "admin"
      style:
        color: "&#FF5555"
        gradient:
          enabled: true
          colors:
            - "&#FF5555"
            - "&#FFB86C"
            - "&#FFF3D6"
        bold: true
        italic: false
        underlined: true
        strikethrough: false

# ----------------------------
# Ваши заметки (MESSAGE STYLES)
#
#
#
# ----------------------------


# ============================================================
# GROUP CHAT CHANNELS
# ============================================================
# Готовый пример каналов.
#
# Как пользоваться:
# 1) Оставьте group-chat.enabled: true
# 2) Выдайте права для нужного канала:
#    cloverchat.channel.<channel>.send
#    cloverchat.channel.<channel>.view
# 3) Пишите сообщение с префиксом канала:
#    @a текст  -> admin
#    @m текст  -> moderator
#    @v текст  -> vip
#    @b текст  -> builder
# 4) Если подходит несколько префиксов, победит самый длинный.

group-chat:
  enabled: true

  channels:
    admin:
      enabled: true
      prefix: "@a "
      display-name: "Admin"
      send-permission: "cloverchat.channel.admin.send"
      view-permission: "cloverchat.channel.admin.view"

    moderator:
      enabled: true
      prefix: "@m "
      display-name: "Moderator"
      send-permission: "cloverchat.channel.moderator.send"
      view-permission: "cloverchat.channel.moderator.view"

    vip:
      enabled: true
      prefix: "@v "
      display-name: "VIP"
      send-permission: "cloverchat.channel.vip.send"
      view-permission: "cloverchat.channel.vip.view"

    builder:
      enabled: true
      prefix: "@b "
      display-name: "Builder"
      send-permission: "cloverchat.channel.builder.send"
      view-permission: "cloverchat.channel.builder.view"

# ----------------------------
# Ваши заметки (GROUP CHAT)
#
#
#
# ----------------------------


# ============================================================
# PRIVATE MESSAGES
# ============================================================

private-chat:
  enabled: true

  # Кулдаун между ЛС-командами (/m)
  cooldown-seconds: 5

  # Звук входящего личного сообщения
  notification-sound: "minecraft:block.note_block.pling"

quick-pm:
  enabled: true

  # true  - ЛС по ПКМ только при зажатом Shift
  # false - ЛС по ПКМ без Shift
  require-sneak: false

  # Подстановка команды в чат
  suggest-command: "/m %target_name% "

# ----------------------------
# Ваши заметки (PRIVATE MESSAGES)
#
#
#
# ----------------------------


# ============================================================
# MENTIONS
# ============================================================

mention:
  # Звук при упоминании игрока: @nick
  sound: "minecraft:block.note_block.pling"

# ----------------------------
# Ваши заметки (MENTIONS)
#
#
#
# ----------------------------


# ============================================================
# CHAT ABOVE HEAD
# ============================================================
# Отображаются только LOCAL и GLOBAL. Закрытые групповые каналы
# и личные сообщения никогда не создают общий пузырь над головой.

chat-above-head:
  enabled: true

  # Время отображения сообщения над головой
  duration-seconds: 4

  # Высота над игроком
  y-offset: 2.25

  # Максимальная длина текста над головой
  max-length: 72

  # Комбо-счетчик, если игрок быстро пишет несколько сообщений
  combo-enabled: true

# ----------------------------
# Ваши заметки (CHAT ABOVE HEAD)
#
#
#
# ----------------------------


# ============================================================
# HOVER FEATURES
# ============================================================

prefix-hover:
  enabled: true

message-hover:
  enabled: true

  # Нажатие по сообщению копирует message ID
  copy-id-on-click: true

  # Формат времени в hover у сообщения
  time-format: "HH:mm:ss"

# ----------------------------
# Ваши заметки (HOVER FEATURES)
#
#
#
# ----------------------------


# ============================================================
# LINKS
# ============================================================

links:
  enabled: true

# ----------------------------
# Ваши заметки (LINKS)
#
#
#
# ----------------------------


# ============================================================
# COMMAND COOLDOWN
# ============================================================

commands-cooldown:
  enabled: true
  seconds: 5

# ----------------------------
# Ваши заметки (COMMAND COOLDOWN)
#
#
#
# ----------------------------


# ============================================================
# JOIN / LEAVE
# ============================================================

join-message:
  enabled: true

leave-message:
  enabled: true

# ----------------------------
# Ваши заметки (JOIN/LEAVE)
#
#
#
# ----------------------------


# ============================================================
# CENSOR
# ============================================================

censor:
  enabled: true

  # Слова-исключения для цензуры
  # Проверка идет по отдельным словам
  words:
    - "херня"
    - "хрен"
    - "дурак"
    - "дура"

# ----------------------------
# Ваши заметки (CENSOR)
#
#
#
# ----------------------------

# ============================================================
# MESSAGE INSPECTOR
# ============================================================
# LOCAL  - built-in SQLite file in plugin folder
# REMOTE - external MySQL database
#
# /cloverchat inspect <message_id>
# Permission: cloverchat.command.inspect

message-inspector:
  enabled: true

  # Сколько дней хранить записи в БД и JSONL-бекапы
  # 0 - хранить без ограничения
  retention-days: 90

  database:
    mode: "LOCAL"
    retry-connect-seconds: 15
    health-check-interval-ticks: 1200

    local:
      file: "storage/message-inspector.db"

    remote:
      host: "127.0.0.1"
      port: 3306
      database: "cloverchat"
      # Можно задать через CLOVERCHAT_DB_USERNAME
      username: "root"
      # Рекомендуется задать через CLOVERCHAT_DB_PASSWORD
      password: "change_me"
      # DISABLED, PREFERRED, REQUIRED, VERIFY_CA или VERIFY_IDENTITY
      ssl-mode: "VERIFY_IDENTITY"
      # Включайте только если это действительно требуется вашей MySQL
      allow-public-key-retrieval: false
      server-timezone: "UTC"

    hikari:
      pool-name: "CloverChat-MessageInspector"
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout-ms: 10000
      validation-timeout-ms: 5000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      keepalive-time-ms: 300000

  writer:
    flush-interval-ticks: 40
    batch-size: 100
    queue-limit: 10000

  cache:
    recent-ids-limit: 500

  backup:
    enabled: true
    folder: "backups/message-inspector"
    max-file-size-mb: 64
