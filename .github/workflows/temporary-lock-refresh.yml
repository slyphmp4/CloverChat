name: Temporary 26.3 Dependency Lock Refresh

on:
  push:
    branches:
      - port/minecraft-26.3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Resolve and verify Paper 26.3 dependencies
        run: |
          chmod +x gradlew
          ./gradlew dependencies --configuration minecraft26_3CompileClasspath \
            --write-locks --write-verification-metadata sha256 --no-daemon

      - name: Commit generated lockfile and SHA256 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.lockfile gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "No dependency metadata changes"
            exit 0
          fi
          git commit -m "build: lock and checksum Paper 26.3 transitive dependencies"
          git push origin HEAD:port/minecraft-26.3
