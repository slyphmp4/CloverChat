name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Smoke Test Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/cloverchat-paper-26.2"
          PLUGIN_VERSION=$(grep '^pluginVersion=' gradle.properties | cut -d'=' -f2)
          mkdir -p "$SMOKE_DIR/plugins"
          PAPER_URL=$(curl -fsSL \
            -H "User-Agent: CloverChat-CI/$PLUGIN_VERSION (slyphmp4@users.noreply.github.com)" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" \
            | jq -r '[.[] | select(.channel == "STABLE")][0].downloads["server:default"].url // empty')
          test -n "$PAPER_URL"
          curl -fsSL \
            -H "User-Agent: CloverChat-CI/$PLUGIN_VERSION (slyphmp4@users.noreply.github.com)" \
            "$PAPER_URL" \
            -o "$SMOKE_DIR/paper.jar"
          cp build/libs/CloverChat.jar "$SMOKE_DIR/plugins/CloverChat.jar"
          printf 'eula=true\n' > "$SMOKE_DIR/eula.txt"
          printf '%s\n' \
            'online-mode=false' \
            'server-port=0' \
            'view-distance=2' \
            'simulation-distance=2' \
            > "$SMOKE_DIR/server.properties"
          cd "$SMOKE_DIR"
          coproc SERVER { java -Xms512M -Xmx1G -jar paper.jar --nogui > server.log 2>&1; }
          SERVER_PROCESS=$SERVER_PID
          READY=false
          for _ in $(seq 1 120); do
            if grep -Fq 'Done (' server.log; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PROCESS" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" != true ]; then
            cat server.log
            exit 1
          fi
          grep -Fq "[CloverChat] Enabling CloverChat v$PLUGIN_VERSION" server.log
          printf 'stop\n' >&"${SERVER[1]}"
          wait "$SERVER_PROCESS"
          grep -Fq "[CloverChat] Disabling CloverChat v$PLUGIN_VERSION" server.log
          if grep -Eiq 'Error occurred while (loading|enabling) CloverChat|Could not load.*CloverChat|NoClassDefFoundError|UnsupportedClassVersionError' server.log; then
            cat server.log
            exit 1
          fi
          grep -E '\[CloverChat\] (Enabling|Disabling)|Done \(' server.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloverChat-build
          path: build/libs/*.jar
          if-no-files-found: ignore
